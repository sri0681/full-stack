<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
    <form action="">
        <fieldset>
            <label for="">Username :</label>
            <input type="text" placeholder="Enter username" id="username"><br><br>
            <label for="">Password :</label>
            <input type="password" placeholder="Enter password" id="password"><br><br>
            <button type="button" id="btn">Generate OTP</button>
            <span>
            </span>
            <br><br>
            <button type="submit">Login</button>
            <button type="reset">Cancel</button>
        </fieldset>
    </form>
    <script>
            let bodycontainer=document.querySelector("body");
            let btn=document.getElementById("btn");
            btn.addEventListener("click",()=>{
                let spancontainer=document.querySelector("span");
                let otp=Math.round(Math.random()*1000000);
                spancontainer.innerText=otp;
                bodycontainer.style.backgroundColor=`#${otp}`
            });
            let userN=document.getElementById("username");
            let psw=document.getElementById("password");
            let formContainer=document.querySelector("form");
            formContainer.addEventListener('submit', (e)=>{
                e.preventDefault();
                console.log("username : ",userN.value);
                console.log("password : ",psw.value);
            });
            let buttons=document.getElementsByTagName("button");
            console.log(buttons[0]);
            console.log(button[1]);
            console.log(button[2]);
    </script>
</body>
</html>
